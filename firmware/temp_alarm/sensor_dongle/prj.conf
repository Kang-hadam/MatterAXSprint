# Thread
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=y

# "ot" commands over the USB serial port
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=416

# "gpio conf gpio0 19 o0" pulls the reset line low and enters the USB bootloader
CONFIG_GPIO_SHELL=y

# Temperature sensor inside the chip
CONFIG_SENSOR=y

CONFIG_MAIN_STACK_SIZE=4096
