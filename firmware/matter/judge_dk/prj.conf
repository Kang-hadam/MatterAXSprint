# Matter
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Ansim Judge"
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/judge_dk.zap"

# 0x8004: example light-switch-app product ID
CONFIG_CHIP_DEVICE_PRODUCT_ID=32772
CONFIG_STD_CPP17=y

# Test commissioning values. chip-tool: pairing ... 20202021 3841
# These also feed the generated factory data.
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF01
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021

# Advertise for commissioning as soon as the device boots unprovisioned.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# LEDs and buttons on the DK
CONFIG_DK_LIBRARY=y

# The anomaly model (firmware/anomaly) is float32 but runs in soft-float on
# purpose: CONFIG_FPU=y enables FPU_SHARING, which enlarges the exception
# frame of every thread and overflowed the stack-tuned Matter/Thread threads
# (hard fault a few minutes after boot). One inference per minute does not
# need the FPU.

# Bluetooth LE
CONFIG_BT_DEVICE_NAME="AnsimJudge"

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Factory data (the DK has the partition for it)
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# Serial log: only this application's lines. The Matter stack, OpenThread
# and the rest of Zephyr stay quiet so the demo log reads as a plain
# status / measurement feed. Set MATTER_LOG_LEVEL_DBG=y to debug the stack.
CONFIG_MATTER_LOG_LEVEL_OFF=y
CONFIG_CHIP_APP_LOG_LEVEL=3
CONFIG_LOG_DEFAULT_LEVEL=1
