# Link the application into the flash region defined by the overlay
# (0x1000-0xD8000), below the dongle's Nordic USB bootloader.
CONFIG_USE_DT_CODE_PARTITION=y

# Settings on storage_partition (NVS); no partition manager on the dongle.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Console, log and shell over USB CDC ACM (the dongle has no UART-to-USB).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Nordic Semiconductor ASA"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Ansim Matter Temp Sensor"
CONFIG_CDC_ACM_SERIAL_VID=0x1915
CONFIG_CDC_ACM_SERIAL_PID=0x0000
CONFIG_UART_LINE_CTRL=y

# "gpio conf gpio@50000000 19 o0" pulls reset low and enters the USB bootloader,
# so the dongle can be re-flashed without reaching the reset button.
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y
CONFIG_OPENTHREAD_PLATFORM_BOOTLOADER_MODE_GPIO=y
