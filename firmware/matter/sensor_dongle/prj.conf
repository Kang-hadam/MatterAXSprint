# Matter
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Ansim Temp Sensor"
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/temperature_sensor.zap"

# 0x800D: example temperature-sensor-app product ID
CONFIG_CHIP_DEVICE_PRODUCT_ID=32781
CONFIG_STD_CPP17=y

# Test commissioning values. chip-tool: pairing ... 20202021 3840
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF00
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021

# Advertise for commissioning as soon as the device boots unprovisioned.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# No factory data partition on the dongle: device identity comes from the
# CONFIG_CHIP_DEVICE_* test values above.
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n
CONFIG_CHIP_FACTORY_DATA_NONE=y

# No MCUboot on the dongle, so no Matter OTA.
CONFIG_CHIP_OTA_REQUESTOR=n

# The dongle has no NFC antenna; the NFC onboarding payload would pull in
# the NFC tag library and fail to link.
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Chip die temperature sensor
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# LEDs and button through the DK library (dongle aliases led0..led3, sw0)
CONFIG_DK_LIBRARY=y

# Bluetooth LE
CONFIG_BT_DEVICE_NAME="AnsimTemp"
CONFIG_BT_DEVICE_NAME_MAX=18

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_PM_DEVICE=y

# No RTT on the dongle
CONFIG_USE_SEGGER_RTT=n

# Serial log: only this application's lines. The Matter stack, OpenThread
# and the rest of Zephyr stay quiet so the demo log reads as a plain
# status / measurement feed. Set MATTER_LOG_LEVEL_DBG=y to debug the stack.
CONFIG_MATTER_LOG_LEVEL_OFF=y
CONFIG_CHIP_APP_LOG_LEVEL=3
CONFIG_LOG_DEFAULT_LEVEL=1
